name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean dist folder
        run: |
          rm -rf dist

      - name: Configure GPG for CI signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "batch" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf

          gpgconf --kill gpg-agent || true

      - name: Import GPG key
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --yes --quiet --import
          gpg --list-secret-keys

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ -z "${tag}" ]]; then
            echo "ERROR: GITHUB_REF_NAME is empty" >&2
            exit 1
          fi

          awk -v tag="${tag}" '
            BEGIN { in_section=0; found=0; n=0 }
            { sub(/\r$/, "") }
            $0 ~ ("^## " tag "([[:space:]]+-[[:space:]].*)?$") {
              in_section=1
              found=1
              print
              next
            }
            in_section && $0 ~ "^## v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?([[:space:]]+-[[:space:]].*)?$" { exit }
            in_section { print; n++ }
            END {
              if (!found) { print "ERROR: release heading not found for " tag > "/dev/stderr"; exit 1 }
              if (n == 0) { print "ERROR: release notes section empty for " tag > "/dev/stderr"; exit 1 }
            }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v2
        with:
          args: release --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_GORELEASER_PAT }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify signatures against KEYS
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          sigs=(dist/*.sig)
          if ((${#sigs[@]} == 0)); then
            echo "ERROR: No detached signatures were generated in dist/." >&2
            exit 1
          fi

          verify_home="$(mktemp -d /tmp/tfquery-release-verify.XXXXXX)"
          trap 'rm -rf "$verify_home"' EXIT

          GNUPGHOME="$verify_home" gpg --batch --import KEYS >/dev/null 2>&1

          for sig in "${sigs[@]}"; do
            artifact="${sig%.sig}"

            if [[ ! -f "$artifact" ]]; then
              echo "ERROR: Missing artifact for signature $sig" >&2
              exit 1
            fi

            GNUPGHOME="$verify_home" gpg --batch --verify "$sig" "$artifact" >/dev/null 2>&1
          done

      - name: Upload KEYS to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "${{ github.ref_name }}" \
            KEYS \
            --repo tfquery/tfquery --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_GORELEASER_PAT }}

      - name: Upload dist folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-outputs
          path: dist/
          retention-days: 5

      - name: Ensure tap release exists
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"

          if gh release view "$tag" --repo tfquery/homebrew-tfquery >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo tfquery/homebrew-tfquery \
              --title "$tag" \
              --notes "Release $tag for Homebrew tap." \
              --prerelease
          else
            gh release create "$tag" \
              --repo tfquery/homebrew-tfquery \
              --title "$tag" \
              --notes "Release $tag for Homebrew tap." \
              --prerelease \
              --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_GORELEASER_PAT }}

      - name: Copy Brew artifacts to tap
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Upload archives
          gh release upload "${{ github.ref_name }}" \
            dist/*.{tar.gz,zip,tar.xz,tgz} \
            --repo tfquery/homebrew-tfquery --clobber || true

          # Upload detached signatures
          gh release upload "${{ github.ref_name }}" \
            dist/*.{tar.gz.sig,zip.sig,tar.xz.sig,tgz.sig} \
            --repo tfquery/homebrew-tfquery --clobber || true

          # Upload docs
          gh release upload "${{ github.ref_name }}" \
            README.md LICENSE KEYS \
            --repo tfquery/homebrew-tfquery --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_GORELEASER_PAT }}
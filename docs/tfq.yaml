# tfquery configuration is made in this document. It should be placed in one of
# the directories as specified in configuration.md. There are two sections -
# GLOBAL and COMMAND-SPECIFIC.

#
# tfquery GLOBAL CONFIGURATION
#

# The top-level `defaults`` argument set is reserved and defines arguments that
# are added into every command line. For example, with the configuration below,
# the command `tfquery sq --color` will effectively become `tfquery sq --padding 1
# --titles --color`. Note that global defaults arguments are the least
# precedent and are overridden by both command-specific config and command line
# arguments. So, for example, `tfquery sq --no-titles` would "cancel out" the
# global `--titles` argument, but `--padding 1` would still be in effect.
defaults:
  - --local
  - --padding 1
  - --titles

# Similar to the global "defaults" set, the "nostate" set is reserved and
# defines arguments that are added into every command line THAT DOES NOT REQUIRE
# STATE. Currently all commands except "sq" are considered "nostate" and will,
# therefore, have these arguments injected. Note that these arguments have a
# higher precedent than "global" arguments, but lower than command-specific
# arguments and command line arguments. For example, with the configuration
# below, the command `tfquery oq` will effectively become `tfquery oq --host
# app.terraform.io`.
nostate:
  - --host app.terraform.io

#
# COMMAND-SPECIFIC CONFIGURATION
#

# Each of the commands (mq, oq, sq, etc) can have their own configuration
# section. Each section is made up of one or more "sets", which are, in turn,
# a list of arguments to automatically use for that command. The set identifier
# `defaults` is reserved and is automatically injected into every command line
# for it's parent command. Any arguments in a set can explicitly be overriden on
# the command line.
#
sq:
  # attrs is a reserved key that defines the default list of output attributes
  # to use for the command. The command itself has a hard-coded list of default
  # attributes, but that value can be overridden here so that a different
  # default list can be used.
  attrs:
    - "!.mode"
    - "!.type"
    - .resource
    - id
    - name

  # defaults is a reserved set identifier that is a list of arguments that are
  # automatically injected into every sq command line.
  #
  # In this example, all sq command lines will automatically be injected with
  # the `--padding 1` and `--short` options. So, the entered command line
  # `tfquery sq` will effectively become `tfquery sq --padding 1 --short`. If
  # the user enters, for example, `tfquery sq --padding 4`, the effective
  # command line will be `tfquery sq --padding 4 --short`, since command line
  # arguments override set arguments.
  defaults:
    - --padding 1
    - --short

  # Alternate argument sets can be specified using the '@set' syntax on the
  # command line. For example, `tfquery sq @example` will inject the arguments
  # from the `example` set in addition to the `defaults`` set. So, `tfquery sq`
  # will become `tfquery sq --padding 1 --short --color --sort id`.
  #
  # Note that argument sets can be specified as YAML collections (`defaults`) or
  # as a single string (`example`).
  example: --color --sort id

#
# PRESETS
#

presets:
  attrs:
    # Global presets that can be used in any command's --attrs arguement.
    # For example, with the configuration below, the command `tfquery sq --attrs
    # set1` will effectively become `tfquery sq --attrs region,tags_all.layer`.
    # Not that these presets are additive, so `tfquery sq --attrs "arn,@set1"`
    # will become `tfquery sq --attrs arn,region,tags_all.layer`. Multiple presets
    # can be used as well. For example, `tfquery sq --attrs "@set1,@set2"` will
    # become `tfquery sq --attrs region,tags_all.layer,arn:ARN:u`.
    set1: region,tags_all.layer
    set2: arn:ARN:u

  filters:
    # Global presets that can be used in any command's --filter arguement. For
    # example, with the configuration below, the command `tfquery sq --filter
    # set1` will effectively become `tfquery sq --filter region=us-west-2`.
    # Multiple presets can be used as well. For example, `tfquery sq --filter
    # "@set1,@set2"` will become `tfquery sq --filter region=us-west-2,
    # tags_all.layer=prod`.
    set1: region=us-east-12
    set2: layer=myapp

  jq:
    query1: '.updated > "2025-06-01"'
    query2: '.name | contains("cloud")'
    lastyear: '((.updated // "")[0:10]) >= ((now - 365*24*60*60) | strftime("%Y-%m-%d"))'

#
# ADDITIONAL CONFIGURATION
#

cache:
  # Number of hours after which cached state file info is considered stale and
  # removed from the cache. Note that cache cleaning occurs even if caching is
  # disabled. Set to 0 to disable automatic cleaning.
  clean: 24

  # Caching of raw state file info used by, currently, only the sq command can
  # be enabled or disabled here. By default it is disabled. This setting can
  # be overriden by the TFQ_CACHE environment variable.
  enabled: false

# Colors to use for --output=text --colors. They must be set here and cannot be
# changed on the command line. Valid #rrggbb HTML codes only.
# colors:
#   title: "#b58900"
#   even: "#ffffff"
#   odd: "#859900"

s3_backend:
  path_style: true
  checksum: false # true=when_required, false=when_supported
